# The re-entrancy and compile-fail topology: `a` and `b` ask each other
# (a request cycle, so the route a:Pong is boxed), and `Event` is a
# fail-fast error fan-out to both.
version: 1
messenger:
  name: AppMessenger
  rust:
    error_type: basable_core::AppError
    ctx_type: basable_core::Ctx
    uses: ["messages::*"]
nanoservices:
  - name: api
    sends:
      - { message: Ping, response: Count }
      - { message: Event, response: error }
  - name: a
    handles:
      - { message: Ping, response: Count }
      - { message: Event, response: error }
    sends:
      - { message: Pong, response: Count }
  - name: b
    handles:
      - { message: Pong, response: Count }
      - { message: Event, response: error }
    sends:
      - { message: Ping, response: Count }
