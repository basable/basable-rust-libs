[package]
name = "basable-processingobject"
description = "The declarative reconciliation framework for basable nanoservices: typed spec and status rows under a generic envelope, reconciled by claimed, fenced attempts. This release ships the store, the claim and completion path, and the worker runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
basable-core = { workspace = true }
basable-db = { workspace = true }
basable-publicid = { workspace = true }
sqlx = { workspace = true }
futures-core = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
uuid = { workspace = true, features = ["v4", "v5"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
