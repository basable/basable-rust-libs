[package]
name = "basable-pubsub"
workspace = "../.."
description = "Cross-replica publish/subscribe for basable nanoservices: a directory of replicas and subscriptions in Postgres, each message sent from the publisher straight to every subscribing replica over pinned mutual TLS, whole and at most once. Processing-object wakes do not use it: they are in process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
basable-core = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
basable-testkit = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
