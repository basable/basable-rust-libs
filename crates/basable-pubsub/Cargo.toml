[package]
name = "basable-pubsub"
workspace = "../.."
description = "Cross-replica publish/subscribe over Postgres LISTEN/NOTIFY for basable nanoservices: one Bus per process multiplexes every logical channel over one listen connection, stamps each payload with its origin for own-message dedup, and bounds payloads under the NOTIFY limit. Distinct from the processing-object wake channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
basable-core = { workspace = true }
basable-db = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
basable-testkit = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
