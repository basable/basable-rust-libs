[package]
name = "basable-app"
description = "The runtime a basable nanoservice binary is assembled on: typed configuration from the environment, the boot sequence (the app pool with a bounded wait, the migration-ledger gate, one NanoPool per stateful nanoservice under a connection budget), the WakeBus (one LISTEN connection per process fanning processing-object wakes to every worker), the pubsub Bus, the worker and ticker registry joined on SIGTERM, one axum server with /healthz and /readyz, and JSON tracing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
basable-core = { workspace = true }
basable-db = { workspace = true }
basable-processingobject = { workspace = true }
basable-pubsub = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
basable-processingobject-testkit = { workspace = true }
basable-testkit = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
