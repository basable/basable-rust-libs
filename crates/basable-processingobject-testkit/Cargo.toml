[package]
name = "basable-processingobject-testkit"
description = "Conformance substrate for basable-processingobject: the reserved conformance type (key 32000, prefix ek) with its nanoservice, migrations and adapter, the WidgetSim provider simulator, and the harness the conformance suites build scenarios from."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
basable-core = { workspace = true }
basable-db = { workspace = true }
basable-processingobject = { workspace = true }
basable-testkit = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
basable-publicid = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
