[package]
name = "basable-messenger-codegen"
description = "The basable messenger code generator as a library: parses and validates routing.yaml (JSON Schema plus the coded semantic rules, every diagnostic with its YAML line), analyses the route graph (boxing a feedback set of the routes that close a cycle), and emits the two generated crates (interfaces, messenger) and the topology documentation. basable-messenger-gen is its command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
jsonschema = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
yaml-rust2 = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
