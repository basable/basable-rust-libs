# Workspace metadata for crate_universe (dependency resolution) and for
# `cargo publish` (the release job). Bazel is the build; see MODULE.bazel.
#
# One workspace version: the basable-* crates are released in lockstep and a
# tenant pins them with `=x.y.z` (the scaffolder's FrameworkVersion).
[workspace]
resolver = "3"
members = [
    "crates/basable-core",
    "crates/basable-publicid",
    "crates/basable-db",
    "crates/basable-testkit",
    "crates/basable-processingobject",
    "crates/basable-processingobject-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# connect-rust's MSRV; the rules_rust toolchain (MODULE.bazel) is newer.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/basable/basable-rust-libs"
homepage = "https://basable.com"
authors = ["basable"]

# The curated dependency baseline. A crate takes one with `workspace = true`;
# a tenant project inherits the same table, so the agent rarely needs a new
# crate. Never openssl, never a crate that needs a system library.
[workspace.dependencies]
basable-core = { version = "=0.1.0", path = "crates/basable-core" }
basable-publicid = { version = "=0.1.0", path = "crates/basable-publicid" }
basable-db = { version = "=0.1.0", path = "crates/basable-db" }
basable-testkit = { version = "=0.1.0", path = "crates/basable-testkit" }
basable-processingobject = { version = "=0.1.0", path = "crates/basable-processingobject" }
basable-processingobject-testkit = { version = "=0.1.0", path = "crates/basable-processingobject-testkit" }

uuid = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# Runtime API only, never the query! macros (they need a database at compile
# time, which the Bazel sandbox does not have). rustls, never openssl.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
futures-core = "0.3"
tracing = "0.1"
# HTTP, for the simulators and later the Connect glue and Kratos client.
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
