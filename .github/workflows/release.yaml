# The one place cargo runs in CI. A tag `vX.Y.Z` checks that the workspace
# version matches and that cargo-based consumers are not broken by a
# Bazel-only change. Publishing itself is done from a logged-in machine,
# after the dry run, in one command that orders the crates by dependency:
#
#   cargo package --workspace --locked        # every crate built from its tarball
#   cargo publish --workspace --locked        # then the tag
#
# so no publish token lives in the repository. Pre-1.0: minor may break,
# patch never; all crates move together.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain Cargo.toml's rust-version names
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: The tag matches the workspace version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$want" != "$have" ]; then
            echo "tag v$want does not match [workspace.package] version $have" >&2
            exit 1
          fi

      - name: Cargo smoke test
        run: cargo check --workspace --locked
