# The CloudNativePG operator: the same pinned release the basable platform
# installs on its own management cluster, resolved by the workflow's Render
# step. Apply wave -2 so the operator's webhook is serving before the Cluster
# below it lands (the platform retries the CR until it is).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.0.yaml

commonAnnotations:
  basable.com/apply-wave: "-2"
