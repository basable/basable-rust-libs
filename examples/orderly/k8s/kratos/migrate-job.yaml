# Wave 0: Kratos's own schema in the `kratos` database.
apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-migrate
  annotations:
    basable.com/apply-wave: "0"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kratos-migrate
          image: docker.io/oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
          args: ["migrate", "sql", "-e", "--yes"]
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: app-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-postgres-app
                  key: password
            - name: DSN
              value: postgres://$(PGUSER):$(PGPASSWORD)@app-postgres-rw:5432/kratos?sslmode=require
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
