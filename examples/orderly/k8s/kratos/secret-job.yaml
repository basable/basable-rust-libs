# The Kratos cookie-signing secret is generated INSIDE the cluster, once.
# Wave -2 (with the CNPG cluster, before anything that reads it): a Job
# asks the API server for the `kratos-secrets` Secret and, only when it is
# absent, creates it with 32 random bytes as `cookie-secret`. A present
# Secret is kept untouched — rotating it would sign every user out. The
# value never exists outside the cluster: not in git, not in CI, not on the
# git host. Every deploy runs a fresh Job (the placeholder in the name);
# after the first one it is a lookup and an exit 0.
#
# The Job talks to the API server with curl and its ServiceAccount token
# (kubectl's official image has no shell to branch on "exists"). The Role
# grants `get` on this one Secret and `create` on Secrets — `create` cannot
# be narrowed to a name, so this ServiceAccount is bound to nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kratos-secrets
  annotations:
    basable.com/apply-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kratos-secrets
  annotations:
    basable.com/apply-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kratos-secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kratos-secrets
  annotations:
    basable.com/apply-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kratos-secrets
subjects:
  - kind: ServiceAccount
    name: kratos-secrets
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-secrets-ensure
  annotations:
    basable.com/apply-wave: "-2"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kratos-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ensure-secret
          image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              NS=$(cat "$SA/namespace")
              TOKEN=$(cat "$SA/token")
              API="https://kubernetes.default.svc/api/v1/namespaces/$NS/secrets"
              code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert "$SA/ca.crt" \
                -H "Authorization: Bearer $TOKEN" "$API/kratos-secrets")
              case "$code" in
                200) echo "kratos-secrets exists; keeping it"; exit 0 ;;
                404) ;;
                *) echo "looking up kratos-secrets: HTTP $code" >&2; exit 1 ;;
              esac
              value=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
              code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert "$SA/ca.crt" \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                -X POST "$API" --data-binary "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"kratos-secrets\"},\"type\":\"Opaque\",\"stringData\":{\"cookie-secret\":\"$value\"}}")
              case "$code" in
                201) echo "kratos-secrets created" ;;
                409) echo "kratos-secrets was created concurrently; keeping it" ;;
                *) echo "creating kratos-secrets: HTTP $code" >&2; exit 1 ;;
              esac
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 32Mi
