# Kratos: passwordless email code + passkeys + Sign in with
# Basable, the identity schema, the self-service flows.
# TENANT_DOMAIN_PLACEHOLDER is replaced by the platform with the environment's
# hostname at deploy. The courier SMTP connection below is a localhost
# placeholder: k8s/kratos/deployment.yaml overrides it with the app-secrets key
# SMTP_CONNECTION_URI when the user has added one (docs/operations.md); until
# then sign-in codes are visible in the Kratos logs only.
#
# Sign in with Basable: the platform's OpenID provider, single sign-on with
# every app on Basable. The `oidc` method is enabled here and its one
# provider is configured in k8s/kratos/deployment.yaml, from the
# `basable-login` Secret the platform writes into every environment's
# cluster (issuer, client id, client secret): no setup, and no SMTP needed
# for it. The person keeps a LOCAL identity in this Kratos; the mapper below
# copies their verified email into its traits, and email codes or a passkey
# work on the same identity afterwards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-config
  annotations:
    basable.com/apply-wave: "1"
data:
  kratos.yaml: |
    version: v26.2.0
    serve:
      public:
        base_url: https://TENANT_DOMAIN_PLACEHOLDER/.ory/
        cors:
          enabled: false
      admin:
        base_url: http://kratos-admin:4434/
    selfservice:
      default_browser_return_url: https://TENANT_DOMAIN_PLACEHOLDER/
      allowed_return_urls:
        - https://TENANT_DOMAIN_PLACEHOLDER/
      flows:
        registration:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/register
          enable_legacy_one_step: true
          after:
            code:
              hooks:
                - hook: session
            oidc:
              hooks:
                - hook: session
        login:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/login
        logout:
          after:
            default_browser_return_url: https://TENANT_DOMAIN_PLACEHOLDER/
        settings:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/settings
        error:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/error
        verification:
          enabled: false
        recovery:
          enabled: false
      methods:
        password:
          enabled: false
        code:
          passwordless_enabled: true
        passkey:
          enabled: true
          config:
            rp:
              display_name: Shop
              id: TENANT_DOMAIN_PLACEHOLDER
              origins:
                - https://TENANT_DOMAIN_PLACEHOLDER
        oidc:
          # The provider list is SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS in
          # k8s/kratos/deployment.yaml (its secret comes from a Secret). To
          # offer another provider beside Basable, add it to that list.
          enabled: true
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/kratos/identity.schema.json
    session:
      lifespan: 24h
      cookie:
        same_site: Lax
    courier:
      smtp:
        connection_uri: smtp://localhost:1025/?disable_starttls=true
        from_address: noreply@TENANT_DOMAIN_PLACEHOLDER
        from_name: Shop
    log:
      level: info
      format: json
  identity.schema.json: |
    {
      "$id": "https://TENANT_DOMAIN_PLACEHOLDER/schemas/identity.default.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Person",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "title": "E-mail",
              "ory.sh/kratos": {
                "credentials": {
                  "code": { "identifier": true, "via": "email" },
                  "passkey": { "display_name": true }
                }
              }
            }
          },
          "required": ["email"],
          "additionalProperties": false
        }
      }
    }
  # Sign in with Basable's claims onto the identity's traits: the platform's
  # id token carries the person's email only when the platform saw it proven
  # (email_verified true), and a sign-in without one is refused here, since
  # the email is what this app's code sign-in finds the person by. The sub
  # is the person's id for THIS project; Kratos keys the OIDC credential by
  # it.
  oidc.basable.jsonnet: |
    local claims = std.extVar('claims');
    if !std.objectHas(claims, 'email') || !std.objectHas(claims, 'email_verified') || claims.email_verified != true then
      error 'Basable sent no verified email address: sign in to Basable with an email code, then try again'
    else {
      identity: {
        traits: {
          email: claims.email,
        },
      },
    }
