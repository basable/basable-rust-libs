# Kratos: passwordless email code + passkeys, the identity schema, the
# self-service flows. TENANT_DOMAIN_PLACEHOLDER is replaced by the platform
# with the environment's hostname at deploy. The courier SMTP connection
# below is a localhost placeholder: k8s/kratos/deployment.yaml overrides it
# with the app-secrets key SMTP_CONNECTION_URI when the user has added one
# (docs/operations.md); until then sign-in codes are visible in the Kratos
# logs only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-config
  annotations:
    basable.com/apply-wave: "1"
data:
  kratos.yaml: |
    version: v26.2.0
    serve:
      public:
        base_url: https://TENANT_DOMAIN_PLACEHOLDER/.ory/
        cors:
          enabled: false
      admin:
        base_url: http://kratos-admin:4434/
    selfservice:
      default_browser_return_url: https://TENANT_DOMAIN_PLACEHOLDER/
      allowed_return_urls:
        - https://TENANT_DOMAIN_PLACEHOLDER/
      flows:
        registration:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/register
          enable_legacy_one_step: true
          after:
            code:
              hooks:
                - hook: session
        login:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/login
        logout:
          after:
            default_browser_return_url: https://TENANT_DOMAIN_PLACEHOLDER/
        settings:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/settings
        error:
          ui_url: https://TENANT_DOMAIN_PLACEHOLDER/auth/error
        verification:
          enabled: false
        recovery:
          enabled: false
      methods:
        password:
          enabled: false
        code:
          passwordless_enabled: true
        passkey:
          enabled: true
          config:
            rp:
              display_name: Shop
              id: TENANT_DOMAIN_PLACEHOLDER
              origins:
                - https://TENANT_DOMAIN_PLACEHOLDER
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/kratos/identity.schema.json
    session:
      lifespan: 24h
      cookie:
        same_site: Lax
    courier:
      smtp:
        connection_uri: smtp://localhost:1025/?disable_starttls=true
        from_address: noreply@TENANT_DOMAIN_PLACEHOLDER
        from_name: Shop
    log:
      level: info
      format: json
  identity.schema.json: |
    {
      "$id": "https://TENANT_DOMAIN_PLACEHOLDER/schemas/identity.default.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Person",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "title": "E-mail",
              "ory.sh/kratos": {
                "credentials": {
                  "code": { "identifier": true, "via": "email" },
                  "passkey": { "display_name": true }
                }
              }
            }
          },
          "required": ["email"],
          "additionalProperties": false
        }
      }
    }
