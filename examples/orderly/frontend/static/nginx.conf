# nginx-unprivileged listens on 8080. Real files are served from the
# document root; anything else is a real 404 (a soft 404 fools everything
# that is not a human). /api/ and /.ory/ never reach this container: the
# HTTPRoute sends them to the app and to Kratos.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
