# The one workflow. The platform deploys the `rendered-manifests` artifact
# this run uploads and nothing else: lint k8s/, build and test with Bazel,
# push the images by commit SHA, pin every built image to its digest, render
# k8s/ with kustomize, upload. Plan commits (docs/** only) start no run and,
# by the platform's rule, create no deployment. See docs/ci.md for the cache
# hygiene rules — they exist because the naive shape ran out of disk.
name: Build

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "docs/**"

env:
  REGISTRY: registry.test.local

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job's OIDC identity token is what logs in to the platform
      # registry (federated to this repository; no secret in the repo).
      id-token: write
      actions: write
    services:
      postgres:
        image: docker.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        # ubuntu-latest ships ~14GB free, most of it preinstalled toolchains
        # this build never uses (Bazel brings its own). A rules_rust build of
        # three images plus the restored caches does not fit beside them: the
        # platform's own CI died mid-build with "No space left on device"
        # before it removed these. NOT /usr/local/lib/android: a transitive
        # rule auto-detects a real SDK path and breaks when it is half-gone.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/share/miniconda /usr/local/julia* /opt/az /opt/microsoft \
            /opt/google /usr/local/share/powershell /usr/local/share/chromium \
            /usr/lib/jvm /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/node /opt/hostedtoolcache/Java_*
          docker image prune -a -f
          df -h /
      # The platform registry namespaces images by project (the same words
      # as its hostname); only the repository's lowercase name comes from
      # the run.
      - name: Set image name
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          echo "IMAGE_NAME=abandon-above-tilt/${repo,,}" >> "$GITHUB_ENV"

      - name: Lint manifests
        run: |
          if grep -rn ':latest' k8s/; then echo "k8s/ must not use :latest tags" >&2; exit 1; fi
          kustomize build --enable-helm k8s/ > /dev/null

      # Two caches, keyed by how often they change: the repository cache and
      # bazelisk by the lockfiles (they change only with a dependency), the
      # disk cache per SHA with a prefix restore (it changes every commit).
      - name: Restore repository cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: repo-cache-${{ hashFiles('MODULE.bazel.lock', 'Cargo.Bazel.lock') }}
          restore-keys: repo-cache-

      - name: Restore disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: disk-cache-${{ github.sha }}
          restore-keys: disk-cache-

      # Every disk-cache entry this build USES has its mtime refreshed (Bazel
      # touches an entry on a hit); anything still older than this marker at
      # the end was dead weight carried in from earlier builds, and the prune
      # step drops it.
      - name: Mark cache epoch
        run: touch "$RUNNER_TEMP/disk-cache-marker"

      # setup-bazel's own caches are off: its disk cache keys on a hash of
      # the BUILD and MODULE files alone and skips the save on an exact hit,
      # so it would stop updating while the sources keep changing. The two
      # caches above are restored and saved by hand instead.
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
          CARGO_BAZEL_REPIN: workspace
        run: bazel test --config=ci //...

      - name: Breaking-change check
        if: github.ref == 'refs/heads/dev'
        run: bazel run --config=ci @rules_buf_toolchains//:buf -- breaking --against '.git#branch=main' || true

      # The job's OIDC identity token, exchanged at the platform registry's
      # token service through this repository's federated service account.
      # crane (the push below) reads the docker config this writes.
      - name: Login to the platform registry
        run: |
          token="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY}" | jq -r .value)"
          echo "${token}" | docker login "${REGISTRY}" --username oidc --password-stdin

      # rules_oci pushes with crane — no Docker daemon. The image() macro
      # pushes the digest tag; --tag adds the commit-SHA tag the platform
      # contract names.
      - name: Build and push images
        id: build
        run: |
          bazel run --config=ci //:push -- --tag ${{ github.sha }}
          # The digest of each built image, read from its index.json — the
          # same source the image() macro derives its tag from — handed to the
          # Render step as an output, never recomputed.
          digest() { jq -r '.manifests[0].digest' "bazel-bin/$1/index.json"; }
          echo "digest_app=$(digest app/app_image)" >> "$GITHUB_OUTPUT"
          echo "digest_frontend=$(digest frontend/static/frontend_image)" >> "$GITHUB_OUTPUT"
          echo "digest_dbmate=$(digest db/app/dbmate_image)" >> "$GITHUB_OUTPUT"
      - name: Render manifests
        run: |
          cd k8s
          kustomize edit set image "${REGISTRY}/${IMAGE_NAME}=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest_app }}"
          kustomize edit set image "${REGISTRY}/${IMAGE_NAME}-frontend=${REGISTRY}/${IMAGE_NAME}-frontend@${{ steps.build.outputs.digest_frontend }}"
          kustomize edit set image "${REGISTRY}/${IMAGE_NAME}-dbmate=${REGISTRY}/${IMAGE_NAME}-dbmate@${{ steps.build.outputs.digest_dbmate }}"
          kustomize build --enable-helm . > ../rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml
          retention-days: 7

      # Cache hygiene, on success only (a failed build keeps the previous good
      # cache): prune the disk cache to what this build touched, save it under
      # this SHA, delete the entries it supersedes. Saved whole, the cache only
      # ever grows, and a dependency bump that invalidates most of it makes
      # the next run carry gigabytes of dead weight plus a full fresh build.
      - name: Prune disk cache
        if: success()
        run: |
          set -euo pipefail
          cache="$HOME/.cache/bazel-disk"
          [ -d "${cache}" ] || exit 0
          echo "before: $(du -sh "${cache}" | cut -f1), $(find "${cache}" -type f | wc -l) entries"
          find "${cache}" -type f ! -newer "$RUNNER_TEMP/disk-cache-marker" -delete
          find "${cache}" -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh "${cache}" | cut -f1), $(find "${cache}" -type f | wc -l) entries"

      - name: Save repository cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: repo-cache-${{ hashFiles('MODULE.bazel.lock', 'Cargo.Bazel.lock') }}

      - name: Save disk cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: disk-cache-${{ github.sha }}

      # A cache entry is immutable, so every commit saves a new one; without
      # this step a ~GB entry per commit piles up until the quota is hit.
      # Only entries created BEFORE this run's: a concurrent run on a newer
      # commit may already have saved its own, and it must survive. The
      # repository cache is keyed by the lockfiles, so a dependency bump
      # leaves the previous entry standing: whichever entry this run used or
      # saved is the newest by access time, every other one is superseded.
      # Best effort: a failure here leaves an extra entry for GitHub's own
      # 7-day eviction, never a broken build.
      - name: Delete superseded caches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mine="disk-cache-${GITHUB_SHA}"
          gh cache list --key disk-cache- --limit 100 --json key,createdAt \
            | jq -r --arg mine "${mine}" '(map(select(.key==$mine))[0].createdAt) as $t
                | if $t == null then empty else .[] | select(.key != $mine and .createdAt < $t) | .key end' \
            | while read -r key; do
                echo "deleting ${key}"
                gh cache delete "${key}" || echo "::warning::could not delete ${key}"
              done
          gh cache list --key repo-cache- --limit 100 --json key,lastAccessedAt \
            | jq -r 'sort_by(.lastAccessedAt) | .[:-1][] | .key' \
            | while read -r key; do
                echo "deleting superseded repository cache ${key}"
                gh cache delete "${key}" || echo "::warning::could not delete ${key}"
              done
