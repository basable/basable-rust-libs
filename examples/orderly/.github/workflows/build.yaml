# The one workflow. The platform deploys what this run uploads and nothing
# else: the `rendered-manifests` artifact and the `static` artifact (the
# frontend, served from the environment's public bucket). In a Debian 13
# container (the release of the app image's base): lint k8s/, build and test
# with Bazel, push the images by commit SHA, pin every built image to its
# digest, render k8s/ with kustomize, upload. Plan commits (docs/** only) start no run and,
# by the platform's rule, create no deployment; neither does the platform's
# commit of its own builder workflow to the default branch. See docs/ci.md for
# the cache hygiene rules — they exist because the naive shape ran out of disk.
name: Build

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/basable-builder.yaml"

env:
  REGISTRY: registry.test.local

jobs:
  build:
    runs-on: ubuntu-latest
    # Every step runs inside a Debian 13 container on that VM: the release
    # the app image's distroless base is built from, so the binary is linked
    # against the glibc it will run on. glibc runs an older binary on a
    # newer libc, never the reverse, and the VM's Ubuntu (26.04 since
    # 2026-10-19) is ahead of every Debian release. There is no Debian VM to
    # pick with runs-on; a job container is how a job builds on one.
    container:
      image: docker.io/library/debian:13.7@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
    # The runner's default shell inside a job container is sh, and the steps
    # below are bash (`${repo,,}`, `set -o pipefail`); Debian ships bash.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      # The job's OIDC identity token is what logs in to the platform
      # registry (federated to this repository; no secret in the repo).
      id-token: write
      actions: write
    services:
      postgres:
        image: docker.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        # No ports: a job container reaches a service by its name on the
        # job's network (TEST_DATABASE_URL below), not through localhost.
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The container starts with the image's packages alone. The C toolchain
      # is what rules_rust links with and the crates' build scripts compile
      # with (cmake is aws-lc-sys's fallback when its cc build is refused);
      # git is for the checkout (without it actions/checkout downloads an
      # archive with no history, and the breaking-change check needs the
      # branches); python3 runs rules_pkg's build_tar (the migrations tarball);
      # zstd keeps the cache entries in the format the platform's builder
      # saves them in; curl and jq serve the registry login and the digests; bazelisk is the `bazel` the steps run (the VM's copy is outside the
      # container); kustomize and helm render the manifests; gh deletes the
      # superseded caches.
      - name: Install the toolchain and tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake curl git jq python3 zstd
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64" -o /usr/local/bin/bazel && chmod +x /usr/local/bin/bazel
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
          curl -fsSL "https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz" | tar -xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          curl -fsSL "https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz" | tar -xz --strip-components=2 -C /usr/local/bin gh_2.102.0_linux_amd64/bin/gh

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The platform registry namespaces images by project (the same words
      # as its hostname); only the repository's lowercase name comes from
      # the run.
      - name: Set image name
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          echo "IMAGE_NAME=abandon-above-tilt/${repo,,}" >> "$GITHUB_ENV"

      - name: Lint manifests
        run: |
          if grep -rn ':latest' k8s/; then echo "k8s/ must not use :latest tags" >&2; exit 1; fi
          kustomize build --enable-helm k8s/ > /dev/null

      # Two caches, keyed by how often they change: the repository cache and
      # bazelisk by the lockfiles (they change only with a dependency), the
      # disk cache per SHA with a prefix restore (it changes every commit).
      # The repository cache falls back on the platform's verified builds'
      # (basable-builder-repo-, saved on the default branch): a download is
      # the same bytes whatever builds. The disk cache does not: the builder
      # links on the VM, and the toolchain is an input of every action, so
      # its entries would never hit in this container. A branch's warm start
      # is its own last entry, which the cleanup below leaves standing.
      - name: Restore repository cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: repo-cache-${{ hashFiles('MODULE.bazel.lock', 'Cargo.Bazel.lock') }}
          restore-keys: |
            repo-cache-
            basable-builder-repo-

      - name: Restore disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: disk-cache-${{ github.sha }}
          restore-keys: |
            disk-cache-

      # Every disk-cache entry this build USES has its mtime refreshed (Bazel
      # touches an entry on a hit); anything still older than this marker at
      # the end was dead weight carried in from earlier builds, and the prune
      # step drops it.
      - name: Mark cache epoch
        run: touch "$RUNNER_TEMP/disk-cache-marker"

      # setup-bazel's own caches are off: its disk cache keys on a hash of
      # the BUILD and MODULE files alone and skips the save on an exact hit,
      # so it would stop updating while the sources keep changing. The two
      # caches above are restored and saved by hand instead.
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://test:test@postgres:5432/test?sslmode=disable
          CARGO_BAZEL_REPIN: workspace
        run: bazel test --config=ci //...

      - name: Breaking-change check
        if: github.ref == 'refs/heads/dev'
        run: bazel run --config=ci @rules_buf_toolchains//:buf -- breaking --against '.git#branch=main' || true

      # The job's OIDC identity token, exchanged at the platform registry's
      # token service through this repository's federated service account,
      # written straight into the docker config crane (the push below)
      # reads: the container has no Docker, and docker login would only
      # write this file.
      - name: Login to the platform registry
        run: |
          token="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY}" | jq -r .value)"
          mkdir -p ~/.docker
          printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY}" "$(printf 'oidc:%s' "${token}" | base64 -w0)" > ~/.docker/config.json

      # rules_oci pushes with crane — no Docker daemon. The image() macro
      # pushes the digest tag; --tag adds the commit-SHA tag the platform
      # contract names.
      - name: Build and push images
        id: build
        run: |
          bazel run --config=ci //:push -- --tag ${{ github.sha }}
          # The digest of each built image, read from its index.json — the
          # same source the image() macro derives its tag from — handed to the
          # Render step as an output, never recomputed.
          digest() { jq -r '.manifests[0].digest' "bazel-bin/$1/index.json"; }
          echo "digest_app=$(digest app/app_image)" >> "$GITHUB_OUTPUT"
          echo "digest_dbmate=$(digest db/app/dbmate_image)" >> "$GITHUB_OUTPUT"
      - name: Render manifests
        run: |
          cd k8s
          kustomize edit set image "${REGISTRY}/${IMAGE_NAME}=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest_app }}"
          kustomize edit set image "${REGISTRY}/${IMAGE_NAME}-dbmate=${REGISTRY}/${IMAGE_NAME}-dbmate@${{ steps.build.outputs.digest_dbmate }}"
          kustomize build --enable-helm . > ../rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml
          retention-days: 7

      # The frontend: the platform puts the `static` artifact's files into the
      # environment's public bucket and serves them at / the moment the
      # upload lands, before the manifests above are applied. The plain pages
      # have nothing to build.
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: static
          path: frontend/static
          retention-days: 7

      # Cache hygiene, on success only (a failed build keeps the previous good
      # cache): prune the disk cache to what this build touched, save it under
      # this SHA, delete the entries it supersedes. Saved whole, the cache only
      # ever grows, and a dependency bump that invalidates most of it makes
      # the next run carry gigabytes of dead weight plus a full fresh build.
      - name: Prune disk cache
        if: success()
        run: |
          set -euo pipefail
          cache="$HOME/.cache/bazel-disk"
          [ -d "${cache}" ] || exit 0
          echo "before: $(du -sh "${cache}" | cut -f1), $(find "${cache}" -type f | wc -l) entries"
          find "${cache}" -type f ! -newer "$RUNNER_TEMP/disk-cache-marker" -delete
          find "${cache}" -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh "${cache}" | cut -f1), $(find "${cache}" -type f | wc -l) entries"

      - name: Save repository cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: repo-cache-${{ hashFiles('MODULE.bazel.lock', 'Cargo.Bazel.lock') }}

      - name: Save disk cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: disk-cache-${{ github.sha }}

      # A cache entry is immutable, so every commit saves a new one; without
      # this step a ~GB entry per commit piles up until the quota is hit.
      # Only this branch's entries (--ref), and only those created BEFORE
      # this run's: a push to main reads main's entries alone, so a dev run
      # must leave main's last one standing for the live deploy to start
      # warm, and a concurrent run on a newer commit may already have saved
      # its own, which must survive. Deleted by id, never by key: after a
      # fast-forward one commit sits on both branches with an entry on each.
      # The repository cache is keyed by the lockfiles, so a dependency bump
      # leaves the previous entry standing: whichever entry this run used or
      # saved is the newest by access time, every other one is superseded.
      # Best effort: a failure here leaves an extra entry for GitHub's own
      # 7-day eviction, never a broken build.
      - name: Delete superseded caches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mine="disk-cache-${GITHUB_SHA}"
          gh cache list --ref "${GITHUB_REF}" --key disk-cache- --limit 100 --json id,key,createdAt \
            | jq -r --arg mine "${mine}" '(map(select(.key==$mine))[0].createdAt) as $t
                | if $t == null then empty else .[] | select(.key != $mine and .createdAt < $t) | "\(.id) \(.key)" end' \
            | while read -r id key; do
                echo "deleting ${key} (${id})"
                gh cache delete "${id}" || echo "::warning::could not delete ${key}"
              done
          gh cache list --ref "${GITHUB_REF}" --key repo-cache- --limit 100 --json id,key,lastAccessedAt \
            | jq -r 'sort_by(.lastAccessedAt) | .[:-1][] | "\(.id) \(.key)"' \
            | while read -r id key; do
                echo "deleting superseded repository cache ${key} (${id})"
                gh cache delete "${id}" || echo "::warning::could not delete ${key}"
              done
