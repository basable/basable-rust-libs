# Metadata only: src/lib.rs is generated by the build from routing.yaml.
[package]
name = "messenger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Declared, not discovered: src/lib.rs is generated by the build, and cargo
# resolves the lock before it exists.
[lib]
path = "src/lib.rs"

[dependencies]
basable-core = { workspace = true }
basable-messenger = { workspace = true }
messages = { path = "../messages" }
interfaces = { path = "../interfaces" }
api = { path = "../../api" }
# basable:nanoservice-deps-begin — one line per nanoservice crate
catalog = { path = "../../nanoservices/catalog" }
order = { path = "../../nanoservices/order" }
notifier = { path = "../../nanoservices/notifier" }
# basable:nanoservice-deps-end

# The generator the build's genrule runs (crate_universe gen_binaries in
# MODULE.bazel): a dependency so it is in the lock, never linked.
[dev-dependencies]
basable-messenger-gen = { workspace = true }
