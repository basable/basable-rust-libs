# Void fan-outs: one event with two handlers, one with none (allowed: the
# route consumes the message), and a handled event nobody sends
# (W_HANDLER_NEVER_SENT).
version: 1
messenger:
  name: AppMessenger
  rust:
    error_type: basable_core::AppError
    ctx_type: basable_core::Ctx
    uses: ["messages::*"]
nanoservices:
  - name: source
    sends:
      - { message: Heard }
      - { message: Unheard }
  - name: x
    handles:
      - { message: Heard }
      - { message: Orphan }
  - name: y
    handles:
      - { message: Heard }
