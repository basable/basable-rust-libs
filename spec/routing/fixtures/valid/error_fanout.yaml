# A fail-fast error fan-out: both handlers declare `response: error`,
# the sender's route calls them in declaration order and returns the first Err.
version: 1
messenger:
  name: AppMessenger
  rust:
    error_type: basable_core::AppError
    ctx_type: basable_core::Ctx
    uses: ["messages::*"]
nanoservices:
  - name: sender
    sends:
      - { message: Event, response: error }
  - name: first
    handles:
      - { message: Event, response: error }
  - name: second
    handles:
      - { message: Event, response: error }
