# A two-node request cycle (a asks b, b asks a): the route a:Pong is
# boxed (W_ROUTE_CYCLE), b:Ping stays a direct call.
version: 1
messenger:
  name: AppMessenger
  rust:
    error_type: basable_core::AppError
    ctx_type: basable_core::Ctx
    uses: ["messages::*"]
nanoservices:
  - name: api
    sends:
      - { message: Ping, response: Count }
  - name: a
    handles:
      - { message: Ping, response: Count }
    sends:
      - { message: Pong, response: Count }
  - name: b
    handles:
      - { message: Pong, response: Count }
    sends:
      - { message: Ping, response: Count }
