# A nanoservice that sends itself a message: a cycle of one, boxed.
version: 1
messenger:
  name: AppMessenger
  rust:
    error_type: basable_core::AppError
    ctx_type: basable_core::Ctx
    uses: ["messages::*"]
nanoservices:
  - name: a
    handles:
      - { message: Tick }
    sends:
      - { message: Tick }
